version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: scanity_db
    environment:
      POSTGRES_USER: ${DB_USER:-scanity_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-scanity_password}
      POSTGRES_DB: scanity
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: scanity_redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: scanity_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@scanity.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    ports:
      - "5050:80"
    depends_on:
      - db
    restart: unless-stopped

volumes:
  postgres_data:
